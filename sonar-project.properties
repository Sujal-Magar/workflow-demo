# Project Identification
sonar.projectKey=expense-tracker
sonar.projectName=Expense Tracker
sonar.projectVersion=1.0.0

# Source & Test Code Structure
# Scoping sonar.sources to only the three src/ trees already excludes
# node_modules, .next, dist, coverage, data (backend runtime db) etc. structurally,
# since none of those live inside a src/ directory.
sonar.sources=frontend/src,backend/src,packages/contracts/src
sonar.tests=frontend/src,backend/src,packages/contracts/src,e2e

# File Inclusions and Exclusions for Tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,**/*.config.*,**/next-env.d.ts,**/*.tsbuildinfo

# Encoding & Environment
sonar.sourceEncoding=UTF-8
sonar.nodejs.executable=node

# TypeScript & JavaScript Analysis
sonar.typescript.tsconfigPaths=frontend/tsconfig.json,backend/tsconfig.json,packages/contracts/tsconfig.json

# Test Execution and Coverage Reports (LCOV) — used by Code Validation 2 (Full Quality Gate) only
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info,packages/contracts/coverage/lcov.info

# Duplicate Detection — don't flag test files as duplication candidates
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
